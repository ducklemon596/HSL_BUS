name: CI/CD HSL Ingestion

on:
  push:
    branches: [ microservices ] 

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  REPO_NAME: hsl-repo
  IMAGE_NAME: ingestion-service
  VM_IP: ${{ secrets.VM_IP }}
  VM_USER: ${{ secrets.VM_USER }}
  KAFKA_BROKER: ${{ secrets.KAFKA_BROKER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Google Auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 \
            -f ingestion_service/Dockerfile \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VM_IP }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo chmod 666 /var/run/docker.sock
            # Xác thực lại docker trên VM
            gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev
            # Xóa container cũ
            docker rm -f ingestion-container || true
            # Kéo bản mới nhất
            docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest
            # Chạy bản mới
            docker run -d \
              --name ingestion-container \
              --restart always \
              -e KAFKA_BROKER="${{ env.KAFKA_BROKER }}" \
              ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest
            docker image prune -f