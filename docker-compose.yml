version: '3.8'
services:
  redis:
    image: redis:latest
    container_name: bus_hsl_redis
    ports:
      - "6379:6379"
    networks:
      - bus_hsl_net

  app:
    build: .
    container_name: bus_hsl_app
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    command: python app.py
    networks:
      - bus_hsl_net

  worker:
    build: .
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    env_file:
      - ./.env
    command: python worker.py
    networks:
      - bus_hsl_net

  ingestion:
    build: .
    container_name: bus_hsl_ingestion
    environment:
      - REDIS_HOST=redis
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    env_file:
      - ./.env
    command: python ingestion.py

networks:
  bus_hsl_net:
    driver: bridge
